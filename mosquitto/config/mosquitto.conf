# Mosquitto configuration for sinotrack-mqtt-bridge
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Anonymous access is enabled by default for easy local testing.
# For anything reachable from the internet, disable it and set a password:
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
allow_anonymous true
listener 1883