name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -v
      - name: Smoke-run the bridge (no broker needed, just config load + TCP bind)
        run: |
          cp config/config.yaml.example config/config.yaml
          timeout 5 python src/main.py --config config/config.yaml || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sinotrack-mqtt-bridge:ci .